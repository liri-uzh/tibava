upstream tibava_backend {
    server backend:8000;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 50G;
    autoindex off;

    # The trailing slash strips /api/ before forwarding because Django routes
    # are rooted at / (for example /healthz/readiness).
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Remote-User $http_x_mail;
        proxy_set_header X-Display-Name $http_x_display_name;
        proxy_pass http://tibava_backend/;
        proxy_redirect off;
    }

    location /thumbnails/ {
        alias /thumbnails/;
    }

    location /media/ {
        alias /media/;
    }

    location /static/ {
        alias /static/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
